<!doctype html>
<html lang="ko">
<head>

  <style>
  :root {
    --brand: #003DA6;
    --brand-dark: #002B76;
    --ink: #111827;
    --muted: #6B7280;
    --line: #E5E7EB;
    --soft-line: #EEF2F7;
    --bg: #EEF2F7;
    --panel: #FFFFFF;
    --card: #FFFFFF;
    --card-soft: #F8FAFC;
    --danger-bg: #FEE2E2;
    --danger-text: #991B1B;
    --success: #059669;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 10px 28px rgba(15, 23, 42, 0.08);
    --radius-lg: 18px;
    --radius-md: 12px;
  }

  * {
    box-sizing: border-box;
  }

  html {
    background: var(--bg);
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Arial, sans-serif;
    background:
      radial-gradient(circle at top left, rgba(0, 61, 166, 0.10), transparent 34%),
      linear-gradient(135deg, #F8FAFC 0%, #EEF2F7 45%, #E5EAF3 100%);
    color: var(--ink);
  }

  .app {
    display: grid;
    grid-template-columns: 460px minmax(0, 1fr);
    min-height: 100vh;
  }

  .panel {
    background: rgba(255, 255, 255, 0.92);
    border-right: 1px solid rgba(226, 232, 240, 0.9);
    padding: 22px;
    overflow-y: auto;
    max-height: 100vh;
    backdrop-filter: blur(12px);
  }

  .preview {
    padding: 28px;
    overflow-y: auto;
    max-height: 100vh;
  }

  h1 {
    position: relative;
    margin: 0 0 8px;
    padding-left: 14px;
    font-size: 22px;
    line-height: 1.25;
    letter-spacing: -0.04em;
    color: #0F172A;
  }

  h1::before {
    content: "";
    position: absolute;
    left: 0;
    top: 3px;
    width: 5px;
    height: 24px;
    border-radius: 999px;
    background: var(--brand);
  }

  .sub {
    margin: 0 0 20px;
    padding: 12px 14px;
    border: 1px solid #DBEAFE;
    border-radius: 14px;
    background: linear-gradient(135deg, #EFF6FF 0%, #FFFFFF 100%);
    font-size: 12.5px;
    color: #475569;
    line-height: 1.55;
  }

  .section {
    position: relative;
    border: 1px solid rgba(226, 232, 240, 0.95);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 14px;
    background: var(--card);
    box-shadow: var(--shadow-sm);
    transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
  }

  .section:hover {
    border-color: rgba(0, 61, 166, 0.22);
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07);
  }

  .section h2 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin: 0 0 14px;
    padding-bottom: 11px;
    border-bottom: 1px solid var(--soft-line);
    font-size: 15px;
    line-height: 1.35;
    letter-spacing: -0.02em;
    color: #0F172A;
  }

  .section-title-tools {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }

  label {
    display: block;
    margin: 11px 0 6px;
    font-size: 12px;
    font-weight: 800;
    color: #334155;
    letter-spacing: -0.01em;
  }

  input,
  textarea,
  select {
    width: 100%;
    border: 1px solid #D7DEE8;
    border-radius: 12px;
    padding: 10px 12px;
    font: inherit;
    font-size: 13px;
    color: #0F172A;
    outline: none;
    background: #FFFFFF;
    transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }

  input::placeholder,
  textarea::placeholder {
    color: #94A3B8;
  }

  textarea {
    min-height: 92px;
    resize: vertical;
    line-height: 1.55;
  }

  input:focus,
  textarea:focus,
  select:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 4px rgba(0, 61, 166, 0.11);
    background: #FFFFFF;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .actions {
    position: sticky;
    bottom: 0;
    z-index: 10;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin: 18px -22px -22px;
    padding: 14px 22px 18px;
    border-top: 1px solid #E2E8F0;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 -14px 30px rgba(15, 23, 42, 0.07);
    backdrop-filter: blur(12px);
  }

  button {
    border: 0;
    border-radius: 12px;
    padding: 10px 12px;
    font-weight: 850;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: -0.01em;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, opacity 0.15s ease;
  }

  button:hover {
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(0);
  }

  .primary {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: #FFFFFF;
    box-shadow: 0 10px 20px rgba(0, 61, 166, 0.22);
  }

  .secondary {
    background: #EEF2F7;
    color: #0F172A;
    border: 1px solid #D7DEE8;
  }

  .secondary:hover {
    background: #E2E8F0;
  }

  .ghost {
    background: #F1F5F9;
    color: #334155;
    border: 1px solid #E2E8F0;
    padding: 7px 9px;
    font-size: 11.5px;
    border-radius: 10px;
  }

  .ghost:hover {
    background: #E2E8F0;
  }

  .danger {
    background: var(--danger-bg);
    color: var(--danger-text);
    border: 1px solid #FECACA;
    padding: 7px 9px;
    font-size: 11.5px;
    border-radius: 10px;
  }

  .item {
    border: 1px solid #E2E8F0;
    border-radius: 15px;
    padding: 14px;
    margin: 12px 0;
    background: linear-gradient(180deg, #F8FAFC 0%, #FFFFFF 100%);
  }

  .item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .item-head strong {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: #0F172A;
  }

  .item-head strong::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--brand);
  }

  .item-tools {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 9px;
    border: 1px solid #E2E8F0;
    border-radius: 999px;
    background: #F8FAFC;
    font-size: 12px;
    font-weight: 800;
    color: #334155;
    white-space: nowrap;
  }

  .toggle input {
    width: auto;
    accent-color: var(--brand);
  }

  .hint {
    margin: 8px 0 0;
    padding: 9px 10px;
    border-radius: 11px;
    background: #F8FAFC;
    color: #64748B;
    font-size: 12px;
    line-height: 1.45;
  }

  .preview-card {
    max-width: 800px;
    margin: 0 auto 22px;
    padding: 14px;
    border: 1px solid rgba(226, 232, 240, 0.9);
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.72);
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(10px);
  }

  .preview-card::before {
    content: "Preview";
    display: block;
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #64748B;
  }

  iframe {
    width: 100%;
    min-height: 1040px;
    border: 1px solid #D7DEE8;
    border-radius: 16px;
    background: #FFFFFF;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
  }

  .output {
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
    border: 1px solid rgba(226, 232, 240, 0.9);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.78);
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(10px);
  }

  .output label {
    margin-top: 0;
  }

  .output textarea {
    min-height: 280px;
    border-radius: 14px;
    background: #0F172A;
    color: #DDE7F3;
    font-family: Consolas, Monaco, "Courier New", monospace;
    font-size: 12px;
    line-height: 1.55;
    white-space: pre;
  }

  .status {
    margin-top: 9px;
    font-size: 12px;
    color: var(--success);
    min-height: 18px;
  }

  .warning {
    margin: 10px 0 0;
    padding: 11px 12px;
    border: 1px solid #FED7AA;
    border-radius: 12px;
    background: #FFF7ED;
    color: #9A3412;
    font-size: 12px;
    line-height: 1.55;
    display: none;
  }

  .panel::-webkit-scrollbar,
  .preview::-webkit-scrollbar {
    width: 10px;
  }

  .panel::-webkit-scrollbar-thumb,
  .preview::-webkit-scrollbar-thumb {
    background: #CBD5E1;
    border-radius: 999px;
    border: 3px solid transparent;
    background-clip: content-box;
  }

  .panel::-webkit-scrollbar-track,
  .preview::-webkit-scrollbar-track {
    background: transparent;
  }

  @media (max-width: 1180px) {
    .app {
      grid-template-columns: 430px minmax(0, 1fr);
    }

    .preview {
      padding: 22px;
    }
  }

  @media (max-width: 980px) {
    .app {
      grid-template-columns: 1fr;
    }

    .panel,
    .preview {
      max-height: none;
    }

    .panel {
      border-right: 0;
      border-bottom: 1px solid #E2E8F0;
    }

    .actions {
      margin-left: -22px;
      margin-right: -22px;
    }
  }

  @media (max-width: 640px) {
    .panel,
    .preview {
      padding: 16px;
    }

    .section {
      padding: 14px;
      border-radius: 16px;
    }

    .section h2,
    .item-head {
      align-items: flex-start;
      flex-direction: column;
    }

    .section-title-tools,
    .item-tools {
      width: 100%;
      justify-content: flex-start;
    }

    .row {
      grid-template-columns: 1fr;
    }

    .actions {
      grid-template-columns: 1fr;
      margin: 18px -16px -16px;
      padding: 12px 16px 16px;
    }
  }
</style>
</head>

  let sectionOrder = ["videos", "infographics", "blogs", "cases", "press"];

  function esc(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function nl2br(value) {
    return esc(value).replace(/\n/g, "<br>");
  }

  function get(id) {
    return document.getElementById(id).value.trim();
  }

  function renderSectionEditors() {
    const wrap = document.getElementById("sectionEditors");
    wrap.innerHTML = "";

    sectionOrder.forEach((key, sectionIndex) => {
      const section = sections[key];

      const box = document.createElement("div");
      box.className = "section";
      box.innerHTML = `
        <h2>
          <span>${esc(section.label)}</span>
          <span class="section-title-tools">
            <button class="ghost" type="button" onclick="moveSection('${key}', -1)">섹션↑</button>
            <button class="ghost" type="button" onclick="moveSection('${key}', 1)">섹션↓</button>
            <label class="toggle"><input type="checkbox" data-section="${key}" data-field="enabled" ${section.enabled ? "checked" : ""}> 노출</label>
          </span>
        </h2>

        <label>더보기 버튼 문구</label>
        <input data-section="${key}" data-field="moreText" value="${esc(section.moreText)}">

        <label>더보기 버튼 링크</label>
        <input data-section="${key}" data-field="moreLink" value="${esc(section.moreLink)}">

        <div class="hint">각 항목의 이미지 URL은 비워두면 텍스트형 콘텐츠로 출력됩니다.</div>

        <div data-items="${key}"></div>

        <button class="ghost" type="button" onclick="addItem('${key}')">+ 콘텐츠 추가</button>
      `;
      wrap.appendChild(box);

      const itemWrap = box.querySelector(`[data-items="${key}"]`);
      section.items.forEach((item, itemIndex) => {
        const itemBox = document.createElement("div");
        itemBox.className = "item";
        itemBox.innerHTML = `
          <div class="item-head">
            <strong>${esc(section.label)} ${itemIndex + 1}</strong>
            <div class="item-tools">
              <button class="ghost" type="button" onclick="moveItem('${key}', ${itemIndex}, -1)">위로</button>
              <button class="ghost" type="button" onclick="moveItem('${key}', ${itemIndex}, 1)">아래로</button>
              <button class="danger" type="button" onclick="removeItem('${key}', ${itemIndex})">삭제</button>
            </div>
          </div>
          <label>이미지 URL</label>
          <input data-section="${key}" data-index="${itemIndex}" data-item-field="image" value="${esc(item.image)}">
          <label>제목</label>
          <input data-section="${key}" data-index="${itemIndex}" data-item-field="title" value="${esc(item.title)}">
          <label>설명</label>
          <textarea data-section="${key}" data-index="${itemIndex}" data-item-field="desc">${esc(item.desc)}</textarea>
          <label>링크</label>
          <input data-section="${key}" data-index="${itemIndex}" data-item-field="link" value="${esc(item.link)}">
        `;
        itemWrap.appendChild(itemBox);
      });
    });

    wrap.querySelectorAll("[data-section]").forEach((el) => {
      el.addEventListener("input", handleEditorInput);
      el.addEventListener("change", handleEditorInput);
    });
  }

  function handleEditorInput(event) {
    const el = event.target;
    const key = el.dataset.section;

    if (!key) return;

    if (el.dataset.itemField) {
      const index = Number(el.dataset.index);
      sections[key].items[index][el.dataset.itemField] = el.value;
    } else if (el.dataset.field === "enabled") {
      sections[key].enabled = el.checked;
    } else if (el.dataset.field) {
      sections[key][el.dataset.field] = el.value;
    }

    refresh();
  }

  function moveSection(key, direction) {
    const index = sectionOrder.indexOf(key);
    const next = index + direction;
    if (next < 0 || next >= sectionOrder.length) return;
    [sectionOrder[index], sectionOrder[next]] = [sectionOrder[next], sectionOrder[index]];
    renderSectionEditors();
    refresh();
  }

  function addItem(key) {
    sections[key].items.push({ image: "", title: "", desc: "", link: "" });
    renderSectionEditors();
    refresh();
  }

  function removeItem(key, index) {
    sections[key].items.splice(index, 1);
    renderSectionEditors();
    refresh();
  }

  function moveItem(key, index, direction) {
    const next = index + direction;
    const items = sections[key].items;
    if (next < 0 || next >= items.length) return;
    [items[index], items[next]] = [items[next], items[index]];
    renderSectionEditors();
    refresh();
  }

  function sectionTitle(text) {
    return `
    <tr>
      <td style="padding:10px 25px 0;">
        <hr style="height:1px; background-color:#000; border:0; margin:10px 0 5px;">
        <h2 style="font-size:18px; color:#003DA6; margin:18px 0 15px; line-height:1.5; font-family:'맑은 고딕', Arial, sans-serif;">${esc(text)}</h2>
      </td>
    </tr>`;
  }

  function contentItem(item) {
    const hasImage = Boolean(item.image && item.image.trim());

    if (hasImage) {
      return `
      <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom:20px;">
        <tbody>
          <tr>
            <td width="120" valign="top" style="padding-right:15px;">
              <a href="${esc(item.link)}" target="_blank" style="font-family:'맑은 고딕', Arial, sans-serif;">
                <img src="${esc(item.image)}" alt="" width="160" style="display:block; width:160px; height:100px; border:0; object-fit:cover;">
              </a>
            </td>
            <td valign="top" style="font-size:14px; line-height:1.5;">
              ${itemText(item)}
            </td>
          </tr>
        </tbody>
      </table>`;
    }

    return `
      <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom:20px;">
        <tbody>
          <tr>
            <td valign="top" style="font-size:14px; line-height:1.5;">
              ${itemText(item)}
            </td>
          </tr>
        </tbody>
      </table>`;
  }

  function itemText(item) {
    const more = item.link
      ? `<a href="${esc(item.link)}" style="color:#003DA6; text-decoration:none; font-weight:bold; font-family:'맑은 고딕', Arial, sans-serif; font-size:10pt;" target="_blank">...더보기</a>`
      : `<span style="color:#9ca3af; font-weight:bold; font-family:'맑은 고딕', Arial, sans-serif; font-size:10pt;">...더보기 링크 필요</span>`;

    return `
      <p style="line-height:1.5; font-family:'Segoe UI', Arial, sans-serif; font-size:10.5pt; margin:0;">
        <strong style="font-family:'맑은 고딕', Arial, sans-serif; font-size:12pt;">${esc(item.title)}</strong>
      </p>
      <p style="margin:8px 0 0; font-size:10.5pt; line-height:1.5; font-family:'맑은 고딕', Arial, sans-serif;">
        <span style="font-family:'맑은 고딕', Arial, sans-serif; font-size:10pt;">${esc(item.desc)}&nbsp;</span>${more}

  }

  function buttonRow(text, link) {
    if (!link) return "";
    return `
      <table border="0" cellspacing="0" cellpadding="0" align="center" width="100%" style="margin:20px 0;">
        <tbody>
          <tr>
            <td align="center">
              <a href="${esc(link)}" target="_blank" style="display:block; width:520px; max-width:520px; text-align:center; background:#003DA6; color:#ffffff; font-size:16px; font-weight:bold; text-decoration:none; padding:16px 0; border-radius:50px; margin:20px auto; font-family:'맑은 고딕', Arial, sans-serif;">${esc(text)}</a>
            </td>
          </tr>
        </tbody>
      </table>`;
  }

  function buildSectionHtml(key) {
    const section = sections[key];
    if (!section.enabled) return "";

    const validItems = section.items.filter((item) => item.title || item.desc || item.image || item.link);

    if (!validItems.length) return "";

    return `
      ${sectionTitle(section.label)}
      <tr>
        <td style="padding:0 25px 20px;">
          ${validItems.map(contentItem).join("")}
          ${buttonRow(section.moreText, section.moreLink)}
        </td>
      </tr>`;
  }

  function validate() {
    const warnings = [];

    [
      ["히어로 이미지", get("heroImage")],
      ["히어로 링크", get("heroLink")],
      ["메인 제목", get("mainTitle")],
      ["CTA 링크", get("mainCtaLink")]
    ].forEach(([label, value]) => {
      if (!value) warnings.push(`${label} 누락`);
    });

    sectionOrder.forEach((key) => {
      const section = sections[key];
      if (!section.enabled) return;

      section.items.forEach((item, index) => {
        const hasContent = item.title || item.desc || item.image || item.link;
        if (!hasContent) return;

        if (!item.title) warnings.push(`${section.label} ${index + 1} 제목 누락`);
        if (!item.link) warnings.push(`${section.label} ${index + 1} 더보기 링크 누락`);
      });
    });

    const box = document.getElementById("warning");
    if (warnings.length) {
      box.style.display = "block";
      box.innerHTML = "<strong>검수 필요:</strong><br>" + warnings.map(esc).join("<br>");
    } else {
      box.style.display = "none";
      box.innerHTML = "";
    }
  }

  function refresh() {
    validate();
    const html = buildEmailHtml();
    document.getElementById("outputHtml").value = html;
    document.getElementById("previewFrame").srcdoc = html;

    const status = document.getElementById("status");
    status.textContent = "미리보기와 HTML 코드가 갱신되었습니다.";
    setTimeout(() => status.textContent = "", 1800);
  }

  async function copyHtml() {
    const html = document.getElementById("outputHtml").value || buildEmailHtml();
    try {
      await navigator.clipboard.writeText(html);
      document.getElementById("status").textContent = "HTML 코드가 복사되었습니다.";
    } catch (e) {
      document.getElementById("outputHtml").select();
      document.execCommand("copy");
      document.getElementById("status").textContent = "HTML 코드가 선택/복사되었습니다.";
    }
  }

  function downloadFile(type) {
    const html = document.getElementById("outputHtml").value || buildEmailHtml();
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `union-newsletter-${date}.${type === "txt" ? "txt" : "html"}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  document.querySelectorAll("input, textarea").forEach((el) => {
    el.addEventListener("input", refresh);
    el.addEventListener("change", refresh);
  });

  renderSectionEditors();
  refresh();
