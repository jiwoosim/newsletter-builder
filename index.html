<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNION biometrics Newsletter Builder</title>
  <style>

  :root {
    --brand: #0A7BEF;
    --brand-dark: #0063C7;
    --brand-deep: #0057B8;
    --ink: #111827;
    --muted: #6B7280;
    --line: #E5E7EB;
    --soft-line: #EEF2F7;
    --bg: #F4F6FA;
    --panel: #FFFFFF;
    --card: #FFFFFF;
    --danger-bg: #FEE2E2;
    --danger-text: #991B1B;
    --success: #059669;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.08);
    --radius-lg: 18px;
  }

  * { box-sizing: border-box; }

  html {
    background: var(--bg);
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Arial, sans-serif;
    background: #F4F6FA;
    color: var(--ink);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0 auto 0 0;
    width: 76px;
    z-index: 1;
    background: linear-gradient(180deg, #0A7BEF 0%, #006EDB 55%, #0057B8 100%);
    box-shadow: 8px 0 24px rgba(0, 87, 184, 0.12);
  }

  .sidebar-write-btn {
    position: fixed;
    top: 24px;
    left: 19px;
    z-index: 3;
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 2px solid rgba(255, 255, 255, 0.86);
    border-radius: 999px;
    background: transparent;
    color: #FFFFFF;
    box-shadow: none;
  }

  .sidebar-write-btn:hover {
    background: rgba(255, 255, 255, 0.14);
    transform: translateY(0);
  }

  .sidebar-write-btn svg {
    display: block;
  }


  .app {
    display: grid;
    grid-template-columns: 520px minmax(0, 1fr);
    min-height: 100vh;
    padding-left: 76px;
  }

  .panel {
    background: #FFFFFF;
    border-right: 1px solid #E5EAF2;
    padding: 30px 22px 24px;
    overflow-y: auto;
    max-height: 100vh;
  }

  .preview {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 32px 40px;
    overflow-y: auto;
    max-height: 100vh;
    background:
      linear-gradient(180deg, #F9FAFC 0%, #F2F4F8 100%);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    line-height: 1.25;
    letter-spacing: -0.04em;
    color: #111827;
  }

  h1::before {
    content: "✦";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    margin-right: 8px;
    border-radius: 9px;
    background: #EAF3FF;
    color: var(--brand);
    font-size: 14px;
    vertical-align: -2px;
  }

  .sub {
    margin: 0 0 20px;
    padding: 14px 16px;
    border: 1px solid #DCEBFF;
    border-radius: 16px;
    background: #F7FBFF;
    font-size: 12.5px;
    color: #536173;
    line-height: 1.55;
  }


  .language-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin: 0 0 14px;
    padding: 5px;
    border: 1px solid #D7DEE8;
    border-radius: 999px;
    background: #EEF4FA;
  }

  .language-switch button {
    padding: 9px 10px;
    border-radius: 999px;
    background: transparent;
    color: #64748B;
    box-shadow: none;
    font-size: 13px;
  }

  .language-switch button.active {
    background: #FFFFFF;
    color: var(--brand);
    border: 1px solid #CFE1F8;
    box-shadow: 0 6px 14px rgba(10, 123, 239, 0.12);
  }

  .quick-tools {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    padding: 12px;
    margin-bottom: 16px;
    border: 1px solid #E3E8F0;
    border-radius: 18px;
    background: #FFFFFF;
    box-shadow: var(--shadow-sm);
  }

  .section {
    position: relative;
    border: 1px solid #E3E8F0;
    border-radius: 18px;
    padding: 0;
    margin-bottom: 14px;
    background: var(--card);
    box-shadow: 0 1px 1px rgba(15, 23, 42, 0.03);
    overflow: hidden;
  }

  .section:hover {
    border-color: #CFE1F8;
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.055);
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 15px 16px;
    border-bottom: 1px solid #EEF2F7;
    background: #FFFFFF;
  }

  .section-header-main {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .section-dot {
    width: 9px;
    height: 9px;
    flex: 0 0 auto;
    border-radius: 999px;
    background: var(--brand);
    box-shadow: 0 0 0 4px #EAF3FF;
  }

  .section-name {
    margin: 0;
    font-size: 15px;
    line-height: 1.35;
    letter-spacing: -0.02em;
    color: #111827;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .section-header-tools {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
    margin-left: auto;
  }

  .section-body {
    padding: 16px;
    background: #FFFFFF;
  }

  .section.collapsed .section-body {
    display: none;
  }

  .section.collapsed .section-header {
    border-bottom: 0;
  }

  label {
    display: block;
    margin: 11px 0 6px;
    font-size: 12px;
    font-weight: 800;
    color: #334155;
    letter-spacing: -0.01em;
  }

  input, textarea, select {
    width: 100%;
    border: 1px solid #D7DEE8;
    border-radius: 12px;
    padding: 10px 12px;
    font: inherit;
    font-size: 13px;
    color: #0F172A;
    outline: none;
    background: #FFFFFF;
    transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }

  textarea {
    min-height: 92px;
    resize: vertical;
    line-height: 1.55;
  }

  input:focus, textarea:focus, select:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 4px rgba(10, 123, 239, 0.12);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .actions {
    position: sticky;
    bottom: 0;
    z-index: 10;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin: 18px -22px -24px;
    padding: 14px 22px 18px;
    border-top: 1px solid #E3E8F0;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 -14px 30px rgba(15, 23, 42, 0.07);
    backdrop-filter: blur(12px);
  }

  button {
    border: 0;
    border-radius: 12px;
    padding: 10px 12px;
    font-weight: 850;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: -0.01em;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, opacity 0.15s ease;
  }

  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  .primary {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: #FFFFFF;
    box-shadow: 0 10px 20px rgba(10, 123, 239, 0.22);
  }

  .secondary {
    background: #EFF4FA;
    color: #0F172A;
    border: 1px solid #D7DEE8;
  }

  .secondary:hover { background: #E4ECF6; }

  .save-action {
    background: #EAF3FF;
    color: #0057B8;
    border-color: #CFE1F8;
  }

  .ghost {
    background: #F3F6FA;
    color: #334155;
    border: 1px solid #E2E8F0;
    padding: 7px 10px;
    font-size: 11.5px;
    border-radius: 10px;
  }

  .danger {
    background: var(--danger-bg);
    color: var(--danger-text);
    border: 1px solid #FECACA;
    padding: 7px 10px;
    font-size: 11.5px;
    border-radius: 10px;
  }

  .collapse-btn {
    min-width: 54px;
    background: #FFFFFF;
    border: 1px solid #CBD5E1;
    color: #0F172A;
    padding: 7px 10px;
    font-size: 11.5px;
    border-radius: 999px;
  }

  .item {
    border: 1px solid #E2E8F0;
    border-radius: 15px;
    padding: 14px;
    margin: 12px 0;
    background: #F8FAFC;
  }

  .item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .item-head strong {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: #0F172A;
  }

  .item-head strong::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--brand);
  }

  .item-tools {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 9px;
    border: 1px solid #E2E8F0;
    border-radius: 999px;
    background: #F8FAFC;
    font-size: 12px;
    font-weight: 800;
    color: #334155;
    white-space: nowrap;
  }

  .toggle input {
    width: auto;
    accent-color: var(--brand);
  }

  .hint {
    margin: 8px 0 0;
    padding: 9px 10px;
    border-radius: 11px;
    background: #F8FAFC;
    color: #64748B;
    font-size: 12px;
    line-height: 1.45;
  }

  .sns-item {
    border: 1px solid #E2E8F0;
    border-radius: 15px;
    padding: 12px;
    margin: 10px 0;
    background: #F8FAFC;
  }

  .sns-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .sns-head strong {
    font-size: 13px;
    color: #0F172A;
  }

  .preview-card {
    width: min(820px, 100%);
    max-width: 820px;
    margin: 0 auto 22px;
    padding: 16px;
    border: 1px solid #E2E8F0;
    border-radius: 22px;
    background: #FFFFFF;
    box-shadow: var(--shadow-md);
  }

  .preview-card::before {
    content: "Preview";
    display: block;
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #64748B;
  }

  iframe {
    width: 100%;
    min-height: 1040px;
    border: 1px solid #D7DEE8;
    border-radius: 16px;
    background: #FFFFFF;
  }

  .calendar-floating-btn {
    position: fixed;
    top: 28px;
    right: 34px;
    z-index: 80;
    width: 48px;
    height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid #D7DEE8;
    border-radius: 16px;
    background: #FFFFFF;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
  }

  .calendar-floating-btn:hover {
    background: #F7FBFF;
  }

  .calendar-svg {
    display: block;
    color: var(--brand);
  }


  .output {
    width: min(820px, 100%);
    max-width: 820px;
    margin: 0 auto;
    padding: 16px;
    border: 1px solid #E2E8F0;
    border-radius: 20px;
    background: #FFFFFF;
    box-shadow: var(--shadow-sm);
  }

  .output label { margin-top: 0; }

  .output textarea {
    min-height: 280px;
    border-radius: 14px;
    background: #0F172A;
    color: #DDE7F3;
    font-family: Consolas, Monaco, "Courier New", monospace;
    font-size: 12px;
    line-height: 1.55;
    white-space: pre;
  }

  .status {
    margin-top: 9px;
    font-size: 12px;
    color: var(--success);
    min-height: 18px;
  }

  .warning {
    margin: 10px 0 0;
    padding: 11px 12px;
    border: 1px solid #FED7AA;
    border-radius: 12px;
    background: #FFF7ED;
    color: #9A3412;
    font-size: 12px;
    line-height: 1.55;
    display: none;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(15, 23, 42, 0.42);
    backdrop-filter: blur(8px);
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-card {
    width: min(560px, 100%);
    max-height: 88vh;
    overflow: auto;
    border: 1px solid rgba(226, 232, 240, 0.95);
    border-radius: 22px;
    background: #FFFFFF;
    box-shadow: 0 24px 60px rgba(15, 23, 42, 0.24);
    padding: 18px;
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .modal-title {
    margin: 0;
    font-size: 18px;
    letter-spacing: -0.03em;
    color: #0F172A;
  }

  .calendar-nav {
    display: grid;
    grid-template-columns: 40px 1fr 40px;
    gap: 8px;
    align-items: center;
    margin: 10px 0 14px;
  }

  .calendar-month {
    text-align: center;
    font-weight: 900;
    color: #0F172A;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .calendar-weekday {
    padding: 8px 0;
    text-align: center;
    font-size: 11px;
    font-weight: 900;
    color: #64748B;
  }

  .calendar-day {
    position: relative;
    min-height: 46px;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    background: #F8FAFC;
    color: #94A3B8;
    font-size: 12px;
    font-weight: 800;
  }

  .calendar-day.current-month {
    color: #334155;
    background: #FFFFFF;
  }

  .calendar-day.saved {
    border-color: rgba(10, 123, 239, 0.36);
    background: #EFF6FF;
    color: var(--brand);
    box-shadow: inset 0 0 0 1px rgba(10, 123, 239, 0.12);
  }

  .calendar-day.saved::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 7px;
    width: 6px;
    height: 6px;
    transform: translateX(-50%);
    border-radius: 999px;
    background: var(--brand);
  }

  .calendar-day.today {
    border-color: #0F172A;
  }

  .calendar-day:not(.saved) {
    cursor: default;
  }

  .calendar-day.saved {
    cursor: pointer;
  }

  .saved-list {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid #E2E8F0;
  }

  .saved-list h3 {
    margin: 0 0 10px;
    font-size: 13px;
    color: #334155;
  }

  .saved-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 6px;
    align-items: center;
    padding: 8px;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    background: #F8FAFC;
    margin-bottom: 6px;
    font-size: 12px;
    color: #334155;
  }

  .save-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding: 8px 10px;
    border: 1px solid #DBEAFE;
    border-radius: 999px;
    background: #EFF6FF;
    color: var(--brand);
    font-size: 12px;
    font-weight: 800;
  }

  .panel::-webkit-scrollbar,
  .preview::-webkit-scrollbar { width: 10px; }

  .panel::-webkit-scrollbar-thumb,
  .preview::-webkit-scrollbar-thumb {
    background: #CBD5E1;
    border-radius: 999px;
    border: 3px solid transparent;
    background-clip: content-box;
  }


  .app.builder-collapsed {
    grid-template-columns: minmax(0, 1fr);
  }

  .app.builder-collapsed .panel {
    display: none;
  }

  .app.builder-collapsed .preview {
    min-height: 100vh;
  }

  .sidebar-write-btn.is-collapsed svg {
    transform: rotate(180deg);
  }

  .save-action {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%) !important;
    color: #FFFFFF !important;
    border-color: transparent !important;
    box-shadow: 0 10px 20px rgba(10, 123, 239, 0.22);
  }

  .toast-message {
    position: fixed;
    left: 50%;
    bottom: 34px;
    z-index: 120;
    transform: translateX(-50%) translateY(16px);
    min-width: 240px;
    max-width: min(420px, calc(100vw - 32px));
    padding: 13px 16px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.94);
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 800;
    text-align: center;
    box-shadow: 0 18px 38px rgba(15, 23, 42, 0.24);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }

  .toast-message.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 980px) {
    body::before,
    .sidebar-write-btn {
      display: none;
    }

    .app {
      grid-template-columns: 1fr;
      padding-left: 0;
    }

    .panel, .preview {
      max-height: none;
    }

    .panel {
      border-right: 0;
      border-bottom: 1px solid #E2E8F0;
    }

    .calendar-floating-btn {
      top: 18px;
      right: 18px;
    }
  }

  @media (max-width: 640px) {
    .panel, .preview { padding: 16px; }
    .section-header, .item-head, .sns-head { align-items: flex-start; flex-direction: column; }
    .section-header-tools, .item-tools { width: 100%; justify-content: flex-start; }
    .row { grid-template-columns: 1fr; }
    .actions {
      grid-template-columns: 1fr;
      margin: 18px -16px -16px;
      padding: 12px 16px 16px;
    }
  }


  /* Glassmorphism UI Upgrade */
  :root {
    --glass-bg: rgba(255, 255, 255, 0.68);
    --glass-bg-strong: rgba(255, 255, 255, 0.84);
    --glass-line: rgba(255, 255, 255, 0.72);
    --glass-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
    --glass-shadow-hover: 0 24px 64px rgba(15, 23, 42, 0.16);
    --blue-glow: 0 18px 38px rgba(10, 123, 239, 0.24);
  }

  body {
    background:
      radial-gradient(circle at 12% 8%, rgba(10, 123, 239, 0.20), transparent 28%),
      radial-gradient(circle at 88% 14%, rgba(90, 120, 255, 0.15), transparent 30%),
      radial-gradient(circle at 65% 88%, rgba(14, 165, 233, 0.11), transparent 32%),
      linear-gradient(135deg, #F8FBFF 0%, #EEF4FB 43%, #E9EEF8 100%) !important;
  }

  body::before {
    background: linear-gradient(180deg, rgba(10,123,239,0.94) 0%, rgba(0,110,219,0.90) 55%, rgba(0,87,184,0.92) 100%) !important;
    backdrop-filter: blur(18px);
    border-right: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: 12px 0 42px rgba(0, 87, 184, 0.18) !important;
  }

  .panel {
    background: rgba(255, 255, 255, 0.58) !important;
    border-right: 1px solid rgba(255, 255, 255, 0.72) !important;
    backdrop-filter: blur(22px) saturate(145%);
    -webkit-backdrop-filter: blur(22px) saturate(145%);
    box-shadow: 18px 0 60px rgba(15, 23, 42, 0.08);
  }

  .preview {
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,0.92), transparent 34%),
      linear-gradient(180deg, rgba(248, 251, 255, 0.76) 0%, rgba(240, 244, 250, 0.88) 100%) !important;
  }

  .sub,
  .quick-tools,
  .section,
  .item,
  .sns-item,
  .preview-card,
  .output,
  .modal-card,
  .saved-row {
    background: var(--glass-bg) !important;
    border: 1px solid var(--glass-line) !important;
    box-shadow: var(--glass-shadow);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
  }

  .quick-tools,
  .section,
  .preview-card,
  .output,
  .modal-card {
    border-radius: 24px !important;
  }

  .section,
  .preview-card,
  .output,
  .modal-card {
    transition:
      transform 0.22s cubic-bezier(.2,.8,.2,1),
      box-shadow 0.22s cubic-bezier(.2,.8,.2,1),
      border-color 0.22s ease,
      background 0.22s ease;
  }

  .section:hover,
  .preview-card:hover,
  .output:hover {
    transform: translateY(-2px);
    box-shadow: var(--glass-shadow-hover);
    border-color: rgba(10, 123, 239, 0.26) !important;
  }

  .section-header {
    background: linear-gradient(180deg, rgba(255,255,255,0.74) 0%, rgba(255,255,255,0.42) 100%) !important;
    border-bottom: 1px solid rgba(226, 232, 240, 0.72) !important;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .section-body {
    background: rgba(255, 255, 255, 0.30) !important;
  }

  .item,
  .sns-item {
    background: rgba(255, 255, 255, 0.46) !important;
    border-radius: 18px !important;

  function todayKey() {
    const now = new Date();
    return formatDateKey(now);
  }

  function formatDateKey(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function parseDateKey(dateKey) {
    const [year, month, day] = dateKey.split("-").map(Number);
    return new Date(year, month - 1, day);
  }

  function isValidDateKey(dateKey) {
    return /^\d{4}-\d{2}-\d{2}$/.test(dateKey);
  }

  function getSavedMap() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    } catch (error) {
      return {};
    }
  }

  function setSavedMap(savedMap) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(savedMap));
  }

  function collectBuilderState() {
    const mainFields = {};

  
  function initGlassInteractions() {
    document.addEventListener("pointerdown", (event) => {
      const button = event.target.closest("button");
      if (!button || button.disabled) return;

      button.classList.add("is-pressing");

      const rect = button.getBoundingClientRect();
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.left = `${event.clientX - rect.left}px`;
      ripple.style.top = `${event.clientY - rect.top}px`;

      button.appendChild(ripple);

      window.setTimeout(() => {
        ripple.remove();
      }, 650);
    });

    document.addEventListener("pointerup", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      window.setTimeout(() => {
        button.classList.remove("is-pressing");
      }, 120);
    });

    document.addEventListener("pointercancel", () => {
      document.querySelectorAll("button.is-pressing").forEach((button) => {
        button.classList.remove("is-pressing");
      });
    });

    document.addEventListener("mouseleave", () => {
      document.querySelectorAll("button.is-pressing").forEach((button) => {
        button.classList.remove("is-pressing");
      });
    });
  }

  document.querySelectorAll("[data-main]").forEach((el) => {
      mainFields[el.id] = el.value;
    });

    return {
      currentLanguage,
      mainFields,
      socials: JSON.parse(JSON.stringify(socials)),
      sections: JSON.parse(JSON.stringify(sections)),
      savedAt: new Date().toISOString()
    };
  }

  function applyBuilderState(state) {
    if (!state) return;

    currentLanguage = state.currentLanguage || "ko";
    updateLanguageButtons();

    if (state.mainFields) {
      Object.entries(state.mainFields).forEach(([id, value]) => {
        const el = document.getElementById(id);
        if (el) {
          el.value = value;
        }
      });
    }

    if (Array.isArray(state.socials)) {
      socials = JSON.parse(JSON.stringify(state.socials));
    }

    if (Array.isArray(state.sections)) {
      sections = JSON.parse(JSON.stringify(state.sections));
    }

    renderSocialEditors();
    renderSectionEditors();
    refresh(false);
  }


  function getLanguageKey() {
    return currentLanguage === "en" ? "en" : "ko";
  }

  function getLanguageLabel(lang) {
    return lang === "en" ? "ENG" : "KOR";
  }

  function normalizeDateEntry(entry) {
    if (!entry) {
      return {};
    }

    // Legacy format: savedMap[date] = state
    if (entry.mainFields || entry.sections || entry.socials) {
      const legacyLang = entry.currentLanguage === "en" ? "en" : "ko";
      return { [legacyLang]: entry };
    }

    return entry;
  }

  function getDateEntry(savedMap, dateKey) {
    const entry = normalizeDateEntry(savedMap[dateKey]);
    savedMap[dateKey] = entry;
    return entry;
  }

  function getSavedLanguagesForDate(savedMap, dateKey) {
    const entry = normalizeDateEntry(savedMap[dateKey]);
    return ["ko", "en"].filter(lang => Boolean(entry[lang]));
  }

  function hasAnySavedLanguage(savedMap, dateKey) {
    return getSavedLanguagesForDate(savedMap, dateKey).length > 0;
  }

  function loadFirstSavedNewsletter(dateKey) {
    const savedMap = getSavedMap();
    const entry = getDateEntry(savedMap, dateKey);
    const preferred = getLanguageKey();

    if (entry[preferred]) {
      loadSavedNewsletter(dateKey, preferred);
      return;
    }

    if (entry.ko) {
      loadSavedNewsletter(dateKey, "ko");
      return;
    }

    if (entry.en) {
      loadSavedNewsletter(dateKey, "en");
      return;
    }

    alert("해당 날짜의 저장본을 찾을 수 없습니다.");
  }

  function saveCurrentNewsletter() {
    const defaultDate = loadedSavedDate || todayKey();
    const dateKey = prompt("저장할 발행일을 입력하세요. 예: 2026-05-29", defaultDate);

    if (dateKey === null) return;

    const normalized = dateKey.trim();

    if (!isValidDateKey(normalized)) {
      alert("날짜 형식이 맞지 않습니다. YYYY-MM-DD 형식으로 입력하세요.");
      return;
    }

    const lang = getLanguageKey();
    const savedMap = getSavedMap();
    const entry = getDateEntry(savedMap, normalized);

    // 하루에 언어별 마지막 저장본 1개만 유지합니다.
    entry[lang] = collectBuilderState();
    savedMap[normalized] = entry;

    setSavedMap(savedMap);

    loadedSavedDate = normalized;
    loadedSavedLanguage = lang;
    calendarDate = parseDateKey(normalized);

    const status = document.getElementById("status");
    status.innerHTML = `<span class="save-badge">${normalized} ${getLanguageLabel(lang)} 저장 완료</span>`;
    showToast(`${normalized} ${getLanguageLabel(lang)} 저장되었습니다.`);

    renderCalendar();
  }

  function backdropCloseCalendar(event) {

      closeCalendar();
    }

  function moveCalendarMonth(direction) {
    calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + direction, 1);
    renderCalendar();

  function renderCalendar() {
    const modal = document.getElementById("calendarModal");
    const grid = document.getElementById("calendarGrid");
    const label = document.getElementById("calendarMonthLabel");
    const list = document.getElementById("savedList");

    if (!grid || !label || !list) return;

    const savedMap = getSavedMap();
    const savedDates = Object.keys(savedMap)
      .filter(dateKey => hasAnySavedLanguage(savedMap, dateKey))
      .sort();

    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    label.textContent = `${year}.${String(month + 1).padStart(2, "0")}`;

    const firstDay = new Date(year, month, 1);
    const startDate = new Date(year, month, 1 - firstDay.getDay());

    const weekdays = ["일", "월", "화", "수", "목", "금", "토"];

    grid.innerHTML = weekdays.map(day => `<div class="calendar-weekday">${day}</div>`).join("");

    const today = todayKey();

    for (let i = 0; i < 42; i++) {
      const current = new Date(startDate);
      current.setDate(startDate.getDate() + i);

      const dateKey = formatDateKey(current);
      const isCurrentMonth = current.getMonth() === month;
      const savedLangs = getSavedLanguagesForDate(savedMap, dateKey);
      const isSaved = savedLangs.length > 0;
      const isToday = dateKey === today;

      const button = document.createElement("button");
      button.type = "button";
      button.className = [
        "calendar-day",
        isCurrentMonth ? "current-month" : "",
        isSaved ? "saved" : "",
        isToday ? "today" : ""
      ].filter(Boolean).join(" ");

      button.textContent = current.getDate();

      if (isSaved) {
        button.title = `${dateKey} 저장본: ${savedLangs.map(getLanguageLabel).join(" / ")}`;
        button.addEventListener("click", () => loadFirstSavedNewsletter(dateKey));
      } else {
        button.disabled = true;
      }

      grid.appendChild(button);
    }

    const monthSavedDates = savedDates.filter(date => {
      const parsed = parseDateKey(date);
      return parsed.getFullYear() === year && parsed.getMonth() === month;
    });

    if (!monthSavedDates.length) {
      list.innerHTML = `<div class="hint">이 달에는 저장된 뉴스레터가 없습니다.</div>`;
      return;
    }

    const rows = [];

    monthSavedDates.forEach(date => {
      const entry = getDateEntry(savedMap, date);

      ["ko", "en"].forEach(lang => {
        const state = entry[lang];
        if (!state) return;

        const savedAt = state.savedAt ? new Date(state.savedAt).toLocaleString("ko-KR") : "";

        rows.push(`
          <div class="saved-row">
            <span><strong>${date}</strong> <b>${getLanguageLabel(lang)}</b><br><small>${esc(savedAt)}</small></span>
            <button class="ghost" type="button" onclick="loadSavedNewsletter('${date}', '${lang}')">불러오기</button>
            <button class="danger" type="button" onclick="deleteSavedNewsletter('${date}', '${lang}')">삭제</button>
          </div>
        `);
      });
    });

    list.innerHTML = rows.join("");
  }

  function loadSavedNewsletter(dateKey, lang) {
    const savedMap = getSavedMap();
    const entry = getDateEntry(savedMap, dateKey);
    const language = lang || getLanguageKey();
    const state = entry[language];

    if (!state) {
      alert("해당 날짜/언어의 저장본을 찾을 수 없습니다.");
      return;
    }

    const ok = confirm(`${dateKey} ${getLanguageLabel(language)} 저장본을 불러올까요? 현재 입력 중인 내용은 저장하지 않으면 사라질 수 있습니다.`);
    if (!ok) return;

    applyBuilderState(state);
    loadedSavedDate = dateKey;
    loadedSavedLanguage = language;
    calendarDate = parseDateKey(dateKey);

    const status = document.getElementById("status");
    status.innerHTML = `<span class="save-badge">${dateKey} ${getLanguageLabel(language)} 저장본을 불러왔습니다.</span>`;
    showToast(`${dateKey} ${getLanguageLabel(language)} 저장본을 불러왔습니다.`);

    closeCalendar();
  }

  function deleteSavedNewsletter(dateKey, lang) {
    const language = lang || getLanguageKey();
    const ok = confirm(`${dateKey} ${getLanguageLabel(language)} 저장본을 삭제할까요?`);
    if (!ok) return;

    const savedMap = getSavedMap();
    const entry = getDateEntry(savedMap, dateKey);

    delete entry[language];

    if (!entry.ko && !entry.en) {
      delete savedMap[dateKey];
    } else {
      savedMap[dateKey] = entry;
    }

    setSavedMap(savedMap);

    if (loadedSavedDate === dateKey && loadedSavedLanguage === language) {
      loadedSavedDate = "";
      loadedSavedLanguage = "";
    }

    renderCalendar();

    const status = document.getElementById("status");
    status.textContent = `${dateKey} ${getLanguageLabel(language)} 저장본이 삭제되었습니다.`;
    showToast(`${dateKey} ${getLanguageLabel(language)} 저장본이 삭제되었습니다.`);
  }

  function handleDynamicInput(event) {
    const el = event.target;
    const section = byId(el.dataset.sectionId);
    if (!section) return;

    if (el.dataset.itemField) {
      const item = section.items[Number(el.dataset.itemIndex)];
      item[el.dataset.itemField] = el.value;
    } else if (el.dataset.sectionField === "enabled") {
      section.enabled = el.checked;
    } else if (el.dataset.sectionField) {
      section[el.dataset.sectionField] = el.value;
    }

    if (el.dataset.sectionField === "label") {
      renderSectionEditors();
    }

    refresh(false);
  }

        <h2 style="font-size:18px; color:#003DA6; margin:18px 0 15px; line-height:1.5; font-family:'맑은 고딕', Arial, sans-serif;">${esc(text)}</h2>
      </td>
    </tr>`;
  }

  function itemText(item) {
    const readMoreText = get("readMoreText") || "...더보기";
    const more = item.link
      ? `<a href="${esc(item.link)}" style="color:#003DA6; text-decoration:none; font-weight:bold; font-family:'맑은 고딕', Arial, sans-serif; font-size:10pt;" target="_blank">${esc(readMoreText)}</a>`
      : `<span style="color:#9ca3af; font-weight:bold; font-family:'맑은 고딕', Arial, sans-serif; font-size:10pt;">${esc(readMoreText)} 링크 필요</span>`;

    return `
      <p style="line-height:1.5; font-family:'Segoe UI', Arial, sans-serif; font-size:10.5pt; margin:0;">
        <strong style="font-family:'맑은 고딕', Arial, sans-serif; font-size:12pt;">${esc(item.title)}</strong>
      </p>
      <p style="margin:8px 0 0; font-size:10.5pt; line-height:1.5; font-family:'맑은 고딕', Arial, sans-serif;">
        <span style="font-family:'맑은 고딕', Arial, sans-serif; font-size:10pt;">${esc(item.desc)}&nbsp;</span>${more}
      </p>`;
  }

  function contentItem(item) {
    const hasImage = Boolean(item.image && item.image.trim());

    if (hasImage) {
      return `
      <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom:20px;">
        <tbody>
          <tr>
            <td width="120" valign="top" style="padding-right:15px;">
              <a href="${esc(item.link)}" target="_blank" style="font-family:'맑은 고딕', Arial, sans-serif;">
                <img src="${esc(item.image)}" alt="" width="160" style="display:block; width:160px; height:100px; border:0; object-fit:cover;">
              </a>
            </td>
            <td valign="top" style="font-size:14px; line-height:1.5;">
              ${itemText(item)}
            </td>
          </tr>
        </tbody>
      </table>`;
    }

    return `
      <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom:20px;">
        <tbody>
          <tr>
            <td valign="top" style="font-size:14px; line-height:1.5;">
              ${itemText(item)}
            </td>
          </tr>
        </tbody>
      </table>`;
  }

  function buttonRow(text, link) {
    if (!link) return "";

    return `
      <table border="0" cellspacing="0" cellpadding="0" align="center" width="100%" style="margin:20px 0;">
        <tbody>
          <tr>
            <td align="center">
              <a href="${esc(link)}" target="_blank" style="display:block; width:520px; max-width:520px; text-align:center; background:#003DA6; color:#ffffff; font-size:16px; font-weight:bold; text-decoration:none; padding:16px 0; border-radius:50px; margin:20px auto; font-family:'맑은 고딕', Arial, sans-serif;">${esc(text)}</a>
            </td>
          </tr>
        </tbody>
      </table>`;
  }

  function buildSectionHtml(section) {
    if (!section.enabled) return "";

    const validItems = section.items.filter(item => item.title || item.desc || item.image || item.link);
    if (!validItems.length) return "";

    return `
      ${sectionTitle(section.label)}
      <tr>
        <td style="padding:0 25px 20px;">
          ${validItems.map(contentItem).join("")}
          ${buttonRow(section.moreText, section.moreLink)}
        </td>
      </tr>`;
  }

  function socialIcon(type) {
    if (type === "home") {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" viewBox="0 0 24 24" aria-hidden="true" style="display:block; margin:0 auto;"><circle cx="12" cy="12" r="12" fill="#fff"></circle><path d="M12 5l7 6h-2v7H7v-7H5l7-6z" fill="#003DA6"></path></svg>`;
    }

    if (type === "facebook") {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" viewBox="0 0 24 24" aria-hidden="true" style="display:block; margin:0 auto;"><circle cx="12" cy="12" r="12" fill="#fff"></circle><path d="M13 10h2.5l-.3 2H13v7h-3v-7H9v-2h1V9c0-1.7.8-3 3.2-3H16v2h-2c-.6 0-1 .4-1 1v1z" fill="#003DA6"></path></svg>`;
    }

    if (type === "linkedin") {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" viewBox="0 0 24 24" aria-hidden="true" style="display:block; margin:0 auto;"><circle cx="12" cy="12" r="12" fill="#fff"></circle><path d="M6.94 9H9.7v9H6.94V9zM8.32 6.5c.88 0 1.44.58 1.44 1.34 0 .75-.55 1.33-1.41 1.33h-.02c-.87 0-1.43-.58-1.43-1.33 0-.76.56-1.34 1.42-1.34zM10.92 9h2.64v1.23h.04c.37-.66 1.26-1.35 2.6-1.35 2.78 0 3.3 1.82 3.3 4.2V18h-2.75v-4.07 c0-.97-.02-2.22-1.35-2.22-1.35 0-1.56 1.05-1.56 2.15V18h-2.75V9z" fill="#003DA6"></path></svg>`;
    }

    if (type === "youtube") {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" viewBox="0 0 24 24" aria-hidden="true" style="display:block; margin:0 auto;"><circle cx="12" cy="12" r="12" fill="#fff"></circle><polygon points="10,8 16,12 10,16" fill="#003DA6"></polygon></svg>`;
    }

    if (type === "support") {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" viewBox="0 0 24 24" aria-hidden="true" style="display:block; margin:0 auto;"><circle cx="12" cy="12" r="12" fill="#fff"></circle><path d="M8 5h5l3 3v11H8V5z" fill="#003DA6"></path><path d="M13 5v3h3" fill="#fff"></path><line x1="9" y1="11" x2="15" y2="11" stroke="#fff" stroke-width="1.2"></line><line x1="9" y1="14" x2="15" y2="14" stroke="#fff" stroke-width="1.2"></line></svg>`;
    }

    return `<svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" viewBox="0 0 24 24" aria-hidden="true" style="display:block; margin:0 auto;"><circle cx="12" cy="12" r="12" fill="#fff"></circle><path d="M8.8 12.9l-1.1-1.1c-1.2-1.2-1.2-3.1 0-4.2 1.2-1.2 3.1-1.2 4.2 0l.8.8-1.4 1.4-.8-.8c-.4-.4-1.1-.4-1.5 0s-.4 1.1 0 1.5l1.1 1.1-1.3 1.3zm2.4 2.7l-.8-.8 1.4-1.4.8.8c.4.4 1.1.4 1.5 0s.4-1.1 0-1.5L13 11.6l1.4-1.4 1.1 1.1c1.2 1.2 1.2 3.1 0 4.2-1.2 1.3-3.1 1.3-4.3.1zm-1.5-2.2l3.7-3.7 1.4 1.4-3.7 3.7-1.4-1.4z" fill="#003DA6"></path></svg>`;
  }

  function buildSocialFooter() {
    const visibleSocials = socials.filter(social => social.label || social.url);
    if (!visibleSocials.length) return "";

    return `
        <table border="0" cellspacing="0" cellpadding="0" align="center">
          <tbody>
            <tr>
              ${visibleSocials.map(social => `
              <td align="center" style="padding:0 12px;">
                <a href="${esc(social.url)}" target="_blank" style="display:inline-block; text-decoration:none; color:#ffffff; font-size:12px; font-weight:bold; font-family:'맑은 고딕';">
                  ${socialIcon(social.type)}
                  <span style="display:block; margin-top:5px; color:#ffffff; font-size:12px; font-weight:bold; font-family:'맑은 고딕';">${esc(social.label)}</span>
                </a>
              </td>`).join("")}
            </tr>
          </tbody>
        </table>`;
  }

  function validate() {
    const warnings = [];

    [
      ["히어로 이미지", get("heroImage")],
      ["히어로 링크", get("heroLink")],
      ["메인 제목", get("mainTitle")],
      ["CTA 링크", get("mainCtaLink")]
    ].forEach(([label, value]) => {
      if (!value) warnings.push(`${label} 누락`);
    });

    sections.forEach(section => {
      if (!section.enabled) return;

      section.items.forEach((item, index) => {
        const hasContent = item.title || item.desc || item.image || item.link;
        if (!hasContent) return;

        if (!item.title) warnings.push(`${section.label} ${index + 1} 제목 누락`);
        if (!item.link) warnings.push(`${section.label} ${index + 1} 더보기 링크 누락`);
      });
    });

    socials.forEach((social, index) => {
      if ((social.label || social.url) && !social.url) {
        warnings.push(`SNS ${index + 1} URL 누락`);
      }
    });

    const box = document.getElementById("warning");

    if (warnings.length) {
      box.style.display = "block";
      box.innerHTML = "<strong>검수 필요:</strong><br>" + warnings.map(esc).join("<br>");
    } else {
      box.style.display = "none";
      box.innerHTML = "";
    }
  }

  function buildEmailHtml() {
    const sectionHtml = sections.map(buildSectionHtml).join("");

    return `<!doctype html>
<html lang="ko">
<head>

</head>
<body style="margin:0; padding:0; background:#ffffff;">

  <tbody>
    <tr>
      <td style="padding:20px;">
        <table width="100%" border="0" cellspacing="0" cellpadding="0">
          <tbody>
            <tr>
              <td align="left" style="padding:10px 20px;">
                <a href="${esc(get("homeUrl"))}" target="_blank">
                  <img src="${esc(get("logoUrl"))}" alt="Union Biometrics" height="35" style="display:block; border:0;">
                </a>
              </td>

              <td align="right" style="padding:10px 20px;">
                <a href="${esc(get("homeUrl"))}" target="_blank">
                  <img src="${esc(get("ubioLogoUrl"))}" alt="UBio" height="35" style="display:block; border:0;">
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>

    <tr>
      <td>
        <a href="${esc(get("heroLink"))}" target="_blank">
          <img src="${esc(get("heroImage"))}" alt="Hero Image" width="100%" style="display:block; border:0; outline:none;">
        </a>
      </td>
    </tr>

    <tr>
      <td style="padding:30px 25px; line-height:1.6;">
        <h1 style="margin:0 0 10px; line-height:1.35; font-family:'맑은 고딕', Arial, sans-serif; color:#1A1A1A; font-size:12pt;">| ${esc(get("mainTitle"))}</h1>
        <p style="font-size:12pt; margin:20px 0 15px; line-height:1.5; font-family:'맑은 고딕', Arial, sans-serif; color:#333333;">${nl2br(get("mainBody"))}</p>
        ${buttonRow(get("mainCtaText"), get("mainCtaLink"))}
      </td>

    ${sectionHtml}

    <tr>
      <td bgcolor="#003DA6" align="center" style="padding:30px 15px; color:#ffffff; font-size:13px;">
        ${buildSocialFooter()}
        <br><br>
        <img src="${esc(get("footerLogoUrl"))}" alt="UNION biometrics" style="width:113px; height:50px; border:0;"><br><br>
        <p style="margin:10px 0 0; font-family:Arial, sans-serif; font-size:9.8pt; line-height:1.5;">Contact us: ${esc(get("footerContactPhone"))}&nbsp;| ${esc(get("footerContactEmail"))}</p>
        <hr style="width:50%; height:1px; background-color:#fff; border:0; margin:15px auto;">

        <p style="margin:5px 0; font-family:Arial, sans-serif; font-size:9.8pt; line-height:1.5;">You are receiving this email as a UNION biometrics partner or subscriber to product updates.</p>
      </td>
    </tr>
  </tbody>
</table>
</div>
</body>
</html>`;
  }

  function refresh(showStatus = true) {
    validate();
    const html = buildEmailHtml();

    document.getElementById("outputHtml").value = html;
    document.getElementById("previewFrame").srcdoc = html;

    if (showStatus) {
      const status = document.getElementById("status");
      status.textContent = "미리보기와 HTML 코드가 갱신되었습니다.";
      showToast("새로고침되었습니다.");
      setTimeout(() => status.textContent = "", 1800);
    }
  }

  async function copyHtml() {
    const html = document.getElementById("outputHtml").value || buildEmailHtml();

    try {
      await navigator.clipboard.writeText(html);
      document.getElementById("status").textContent = "HTML 코드가 복사되었습니다.";
      showToast("HTML 코드가 복사되었습니다.");
    } catch (e) {
      document.getElementById("outputHtml").select();
      document.execCommand("copy");
      document.getElementById("status").textContent = "HTML 코드가 선택/복사되었습니다.";
      showToast("HTML 코드가 복사되었습니다.");
    }
  }

  function downloadFile(type) {
    const html = document.getElementById("outputHtml").value || buildEmailHtml();
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().slice(0, 10);

    a.href = url;
    a.download = `union-newsletter-${date}.${type === "txt" ? "txt" : "html"}`;

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);
  }

  document.querySelectorAll("[data-main]").forEach((el) => {
    el.addEventListener("input", () => refresh(false));
    el.addEventListener("change", () => refresh(false));
  });

  document.getElementById("newCategoryName").addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      addCategoryFromInput();
    }
  });

  updateLanguageButtons();
  renderSocialEditors();
  renderSectionEditors();
  refresh(false);
</script>
</body>
</html>
